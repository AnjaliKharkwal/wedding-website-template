<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shivangi & Manan | Wedding Invitation</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ==============================
         ENVELOPE OPENING SCREEN
    =============================== -->

    <section id="opening-screen" class="opening-screen">

        <div class="envelope-area">

            <!-- Golden butterflies -->
            <div class="butterfly butterfly-1">🦋</div>
            <div class="butterfly butterfly-2">🦋</div>
            <div class="butterfly butterfly-3">🦋</div>
            <div class="butterfly butterfly-4">🦋</div>
            <div class="butterfly butterfly-5">🦋</div>
            <div class="butterfly butterfly-6">🦋</div>

            <!-- Envelope -->
            <div class="envelope" id="envelope">

                <div class="envelope-back"></div>

                <div class="envelope-paper">
                    <span>Shivangi</span>
                    <span>&</span>
                    <span>Manan</span>
                </div>

                <div class="envelope-front"></div>

                <div class="envelope-flap" id="envelope-flap"></div>

                <!-- Shine -->
                <div class="envelope-shine"></div>

            </div>

            <button id="open-button" class="open-button">
                OPEN INVITATION
            </button>

        </div>

    </section>


    <!-- ==============================
         WEDDING INVITATION
    =============================== -->

    <main id="wedding-content" class="wedding-content">

        <img
            src="assets/hero.png"
            alt="Shivangi and Manan Wedding Invitation"
            class="hero-artwork"
        >

    </main>


    <script src="script.js"></script>

</body>
</html>
